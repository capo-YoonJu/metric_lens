[project]
name = "metric-lens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "langfuse>=4.0.0",
    "langchain>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metric_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
